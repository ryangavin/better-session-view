<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="set" x1="82" y1="74" x2="430" y2="438" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#63F5A6"/>
      <stop offset="0.52" stop-color="#10D7C7"/>
      <stop offset="1" stop-color="#1EA7FF"/>
    </linearGradient>
    <clipPath id="disc">
      <circle cx="256" cy="256" r="200"/>
    </clipPath>
  </defs>

  <circle cx="256" cy="256" r="220" fill="#090A0E"/>
  <circle cx="256" cy="256" r="200" fill="#F7F4EB"/>
  <path d="M256 56A200 200 0 0 1 256 456A100 100 0 0 1 256 256A100 100 0 0 0 256 56Z" fill="url(#set)"/>

  <!-- Three dramatically staggered rows per bank; every row reaches the disc edge. -->
  <g clip-path="url(#disc)">
    <g fill="url(#set)" opacity="0.96">
      <rect x="0" y="90" width="178" height="28" rx="10"/>
      <rect x="0" y="142" width="256" height="28" rx="10"/>
      <rect x="0" y="194" width="220" height="28" rx="10"/>
    </g>
    <g fill="#090A0E" opacity="0.52">
      <rect x="292" y="290" width="220" height="28" rx="10"/>
      <rect x="256" y="342" width="256" height="28" rx="10"/>
      <rect x="334" y="394" width="178" height="28" rx="10"/>
    </g>
  </g>

  <circle cx="256" cy="156" r="30" fill="url(#set)"/>
  <circle cx="256" cy="356" r="30" fill="#F7F4EB"/>
</svg>
