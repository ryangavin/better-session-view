# mix[flow], packaged. `npm run pack:mix`.
#
# The shape is `desktop/electron-builder.base.yml`; this is what is only true of
# this app — its name, and the one file it runs that neither vite nor esbuild
# produced. What it still needs and does not have is a decision about where the
# Python *environment* comes from in a bundle: see `docs/demucs.md`.
extends: ../desktop/electron-builder.base.yml

appId: com.openflow.mix
productName: mix[flow]

# The download name, which is not the app name — see the base config for why the
# brackets cannot survive into a filename.
artifactName: mix-flow-${version}-${arch}.${ext}

# The two things this app runs that neither vite nor esbuild produced.
#
# `python/` is the separation worker, which is ours, plus the `pyproject.toml`
# and `uv.lock` the engine is built from. `bin/uv` is the pinned binary that
# builds it — fetched and checked by `mix/tools/prepare.ts`, and the reason a
# packaged app can set itself up on a machine with no toolchain on it.
# `docs/demucs.md` has the decision behind both.
#
# `bin/uv` is a Mach-O, so a signed build signs it along with everything else in
# the bundle. It is a static Rust binary with no JIT and nothing to load, so the
# hardened runtime has no argument with it.
files:
  - python/**
  - bin/uv

directories:
  output: ../release/mix
