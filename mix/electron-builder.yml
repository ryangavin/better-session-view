# mix[flow], packaged. `npm run pack:mix`.
#
# The shape is `desktop/electron-builder.base.yml`; this is what is only true of
# this app — its name, and the one file it runs that neither vite nor esbuild
# produced. What it still needs and does not have is a decision about where the
# Python *environment* comes from in a bundle: see `docs/demucs.md`.
extends: ../desktop/electron-builder.base.yml

appId: com.openflow.mix
productName: mix[flow]

# The download name, which is not the app name — see the base config for why the
# brackets cannot survive into a filename.
artifactName: mix-flow-${version}-${arch}.${ext}

# The things this app runs that neither vite nor esbuild produced.
#
# `python/` is the separation worker, which is ours, plus the `pyproject.toml`
# and `uv.lock` the engine is built from. `bin/` is the pinned `uv` that builds
# it, the official pinned yt-dlp used for YouTube imports, and the LGPL-only
# FFmpeg/FFprobe pair that opens every advertised source format.
# `mix/tools/prepare.ts` fetches or builds and verifies all four, along with the
# FFmpeg license, provenance, and corresponding source archive. `docs/demucs.md`
# has the engine decision; `docs/library.md` has the downloader boundary.
#
# The four executables are Mach-Os, so a signed build signs them along with
# everything else in the bundle. They load only macOS system libraries and have
# no JIT, so the hardened runtime has no argument with them.
files:
  - python/**
  - bin/**

directories:
  output: ../release/mix
