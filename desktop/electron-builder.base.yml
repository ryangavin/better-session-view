# Everything true of every app here. Each app's own `electron-builder.yml`
# names itself and extends this — `extends` takes a path relative to the project
# directory, and combines `files` glob patterns rather than replacing them, so an
# app with a server of its own adds one line instead of restating the list.
#
# What packaging buys, and it is not distribution: a real bundle identifier, a
# real name in the menu bar, and an icon of its own. Unpackaged, every app here
# says "Electron" and shares its Dock icon, so ⌘-Tab cannot tell them apart —
# which is a small thing until you are reaching for one of them mid-set.
#
# The two strings an app repeats from `desktop/src/apps.ts` are `productName` and
# the stem of `artifactName`. There is no way to hand a registry to a packager,
# and they are app identity rather than app behaviour, so they are stated in both
# registers on purpose.
copyright: © Ryan Gavin

directories:
  buildResources: electron/dist

# Everything the app runs is already bundled: the renderer by vite, the main and
# preload by esbuild. There is nothing to resolve at runtime, so this is the
# whole of it — and the dependency tree electron-builder would otherwise copy in
# is dead weight.
files:
  - package.json
  - dist/**
  - electron/dist/main.cjs
  - electron/dist/preload.cjs
  - '!node_modules/**'

# Plain files rather than an archive. asar is a packaging optimisation that buys
# nothing here and costs a class of path problem — `app.asar.unpacked`, and fs
# calls that work only through Electron's patched fs.
asar: false

# The `.dmg` is the file that actually travels, and electron-builder notarises
# the `.app` inside it and nothing else. An unsigned disk image is assessed by
# Gatekeeper on open and fails there, however good the bundle within it is — so
# this signs it, and `.github/workflows/release.yml` notarises and staples it
# afterwards. Both halves are needed: the ticket on the app survives being
# dragged out of the image, the ticket on the image is what lets it open.
dmg:
  sign: true

mac:
  category: public.app-category.music
  icon: electron/dist/icon.icns
  target:
    - dmg
    - dir
  # Signed with whatever Developer ID is in the keychain, and notarised when the
  # notary credentials are in the environment. `.github/workflows/release.yml`
  # supplies both; nothing else has to, and no flag turns it on.
  #
  # A machine with neither still packs — electron-builder warns and leaves the
  # ad-hoc signature the linker wrote. That bundle is fine for
  # `npm run install:apps` and worthless anywhere else: it reads
  # `Identifier=Electron` with `Sealed Resources=none`, so a Mac that did not
  # build it reports it as damaged rather than as unsigned. Distributing one is
  # a worse first run than distributing nothing.
  #
  # `npm run qa` overrides both — `-c.mac.target=dir -c.mac.identity=null` —
  # because it installs the `.app` locally and never opens a disk image.
  # Measured: signing costs about 90s per app and the image about as much again,
  # against 4.7s for the ad-hoc bundle described above, which is the one QA
  # wants. `npm run pack` is unchanged and still produces the signed pair.
  #
  # Hardened runtime and the entitlements notarisation demands are already
  # electron-builder's defaults for a Developer ID build — JIT, unsigned
  # executable memory, and library validation off. Electron needs the first two,
  # so there is no plist of our own to keep in step.

# No `publish:` block, and `desktop/src/update.ts` explains what turning one on
# takes. Adding it here is what writes `app-update.yml` into every bundle, which
# is the switch the updater checks for — but Squirrel.Mac also needs `zip` beside
# `dmg` above, and a feed cannot see a draft release, which is what `release.yml`
# creates on purpose.
